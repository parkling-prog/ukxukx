<style>
  :root{
    --bg:#FBF7F1; --ink:#2A1F17; --muted:#7A6A5C;
    --caramel:#A4641A; --caramel-deep:#7A4810;
    --shadow-warm: 0 10px 30px -10px rgba(164,100,26,.35);
    --shadow-soft: 0 8px 24px -10px rgba(42,31,23,.18);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Noto Sans TC',sans-serif;-webkit-font-smoothing:antialiased}
  img{display:block;max-width:100%;height:auto}
  a{color:inherit;text-decoration:none}
  .serif{font-family:'Noto Serif TC',serif}
  main{max-width:440px;margin:0 auto;min-height:100vh;background:var(--bg)}
  .hero{position:relative;overflow:hidden}
  .hero img.cover{width:100%;height:78vh;object-fit:cover}
  .hero .overlay{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 0%,transparent 55%,var(--bg) 100%)}
  .hero .tags{position:absolute;top:20px;left:20px;right:20px;display:flex;justify-content:space-between}
  .hero .tag{font-size:11px;letter-spacing:.3em;color:#fff;background:rgba(42,31,23,.35);backdrop-filter:blur(6px);border-radius:999px;padding:6px 12px;text-transform:uppercase}
  .hero .content{padding:0 24px;margin-top:-80px;position:relative;z-index:2;text-align:center;animation:floatUp .8s ease-out both}
  .eyebrow{color:var(--caramel-deep);font-size:13px;letter-spacing:.25em;margin-bottom:12px}
  h1.serif{font-size:2rem;line-height:1.3;color:var(--ink)}
  h1 .accent{color:var(--caramel-deep)}
  .cta{display:inline-flex;align-items:center;justify-content:center;width:100%;border-radius:999px;background:#06C755;color:#fff;font-weight:500;font-size:16px;padding:16px 24px;box-shadow:var(--shadow-warm);transition:transform .15s,background .15s;border:none;cursor:pointer}
  .cta:hover{background:#05b34c}
  .cta:active{transform:scale(.98)}
  .cta-hint{font-size:12px;color:var(--muted);margin-top:8px}
  .why{padding:0 24px;margin-top:48px}
  .why img{width:100%;border-radius:14px;box-shadow:var(--shadow-soft)}
  .final{margin-top:56px;padding:0 24px 48px;text-align:center}
  .final .micro{font-size:11px;letter-spacing:.4em;color:var(--caramel-deep);margin-bottom:12px}
  .final h2{font-family:'Noto Serif TC',serif;font-size:1.75rem;line-height:1.4;color:var(--ink)}
  .final p.sub{font-size:14px;color:var(--muted);margin-top:12px}
  .final .cta{margin-top:28px}
  .final .foot{font-size:11px;color:var(--muted);margin-top:12px}
  .copy{font-size:11px;color:rgba(122,106,92,.6);margin-top:8px;letter-spacing:.05em;text-align:center}
  @keyframes floatUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
</style>
