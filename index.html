<style>
  :root{

    --ink:#2B2118;

    --caramel-deep:#8A4F18;
    --line:#06C755;
    --shadow-warm: 0 12px 30px -10px rgba(139,79,24,0.35);
    --shadow-soft: 0 8px 24px -12px rgba(43,33,24,0.2);

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Noto Sans TC',-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased;}
  img{display:block;max-width:100%;height:auto}

  /* HERO */
  .hero{position:relative}
  .hero-wrap{position:relative;overflow:hidden}
  .hero-img{width:100%;height:78vh;object-fit:cover}
  .hero-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 50%,var(--bg) 100%)}
  .badges{position:absolute;top:20px;left:20px;right:20px;display:flex;justify-content:space-between;align-items:center}
  .badge{font-size:11px;letter-spacing:0.3em;color:rgba(255,255,255,0.9);font-weight:500;text-transform:uppercase;backdrop-filter:blur(6px);background:rgba(43,33,24,0.2);border-radius:9999px;padding:6px 12px}
  .badge.sm{letter-spacing:normal;text-transform:none}

  .hero-content{padding:0 24px;margin-top:-80px;position:relative;z-index:10;text-align:center;animation:floatUp 0.8s ease-out}
  @keyframes floatUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  .eyebrow{color:var(--caramel-deep);font-size:14px;letter-spacing:0.25em;margin-bottom:12px}
  h1{font-family:'Noto Serif TC',serif;font-size:2rem;line-height:1.3;color:var(--ink);font-weight:700}
  h1 .accent{color:var(--caramel-deep)}

  .cta-btn{display:inline-flex;align-items:center;justify-content:center;width:100%;border-radius:9999px;background:var(--line);color:#fff;font-weight:500;font-size:16px;padding:16px 24px;box-shadow:var(--shadow-warm);transition:transform 0.15s, background 0.2s;border:none;cursor:pointer}
  .cta-btn:hover{background:#05b34c}
  .cta-btn:active{transform:scale(0.98)}
  .cta-wrap{margin-top:24px}
  .cta-note{font-size:12px;color:var(--muted);margin-top:8px}

  /* WHY */
  .why{padding:0 24px;margin-top:48px}
  .why img{width:100%;border-radius:12px;box-shadow:var(--shadow-soft)}

  /* FINAL */
  .final{margin-top:56px;padding:0 24px 48px}
  .final-inner{text-align:center;position:relative}
  .limited{font-size:11px;letter-spacing:0.4em;color:var(--caramel-deep);margin-bottom:12px}
  h2{font-family:'Noto Serif TC',serif;font-size:1.75rem;line-height:1.4;color:var(--ink);font-weight:700}
  .final p.intro{font-size:14px;color:var(--muted);margin-top:12px;line-height:1.6}
  .final .cta-btn{margin-top:28px}
  .final .cta-note{margin-top:12px;font-size:11px}
  .tagline{text-align:center;font-size:11px;color:var(--muted);margin-top:16px;letter-spacing:0.08em}
  .company{text-align:center;font-size:11px;color:rgba(138,122,107,0.7);margin-top:24px;letter-spacing:0.08em;line-height:1.8}
